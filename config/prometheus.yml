global:
  scrape_interval: 15s
  evaluation_interval: 60s

rule_files: []

scrape_configs:
  # Host metrics via node_exporter
  # Install node_exporter on your hosts and add their addresses here
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Container metrics via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # OpenWrt access points / repeaters running node_exporter.
  # Uncomment and set IPs to enable. The `node` label drives the
  # OpenWrt dashboard's device dropdown.
  # - job_name: "openwrt"
  #   static_configs:
  #     - targets: ["198.51.100.10:9100"]
  #       labels:
  #         node: "ap-main"
  #     - targets: ["198.51.100.11:9100"]
  #       labels:
  #         node: "ap-upper"
  #     - targets: ["198.51.100.20:9100"]
  #       labels:
  #         node: "repeater-1"
