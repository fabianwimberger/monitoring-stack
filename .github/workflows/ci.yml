name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --group dev

      - name: Lint YAML files
        run: |
          .venv/bin/python -m yamllint -d relaxed config/
          .venv/bin/python -m yamllint -d relaxed docker-compose.yml
          .venv/bin/python -m yamllint -d relaxed docker-compose.proxy.yml

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config > /dev/null

      - name: Validate docker-compose.proxy.yml syntax
        run: |
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config > /dev/null

  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Prometheus config
        run: |
          image=$(docker compose config --format json | jq -r '.services.prometheus.image')
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/config:/etc/prometheus:ro" "$image" \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alloy config
        run: |
          image=$(docker compose config --format json | jq -r '.services.alloy.image')
          docker run --rm \
            -v "$PWD/config/alloy.alloy:/etc/alloy/config.alloy:ro" "$image" \
            validate /etc/alloy/config.alloy

      - name: Validate dashboards are valid JSON
        run: |
          for f in dashboards/*.json; do
            jq empty "$f"
          done

      - name: Check required files exist
        run: |
          for f in config/prometheus.yml config/loki.yml config/alloy.alloy .env.example; do
            test -f "$f" || { echo "$f not found"; exit 1; }
          done
