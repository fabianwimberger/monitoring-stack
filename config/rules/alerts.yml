groups:
  - name: targets
    rules:
      # A target labelled optional="true" (a laptop that sleeps) never alerts
      - alert: TargetDown
        expr: up{job!="openwrt", optional!="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"

      - alert: OpenWrtNodeDown
        expr: up{job="openwrt"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "OpenWrt node {{ $labels.node }} ({{ $labels.instance }}) is down"

  - name: containers
    rules:
      # cAdvisor drops a stopped container's series, so compare with the last six
      # hours. Only containers seen for at least an hour (360 samples at a 10 s
      # scrape) count; throwaway `docker run --rm` containers come and go.
      - alert: ContainerMissing
        expr: |
          count by (name, nodename) (count_over_time(container_last_seen{name!=""}[6h]) > 360)
            unless
          count by (name, nodename) (container_last_seen{name!=""})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.nodename }} is gone"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[30m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.nodename }} restarted {{ $value }} times in 30 min"

  - name: disk
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/boot.*"}
            / node_filesystem_size_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: {{ $value | humanizePercentage }} free"

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/boot.*"}
            / node_filesystem_size_bytes < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: only {{ $value | humanizePercentage }} free"

      - alert: DiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/boot.*"}[6h], 24 * 3600) < 0
            and
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/boot.*"}
            / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} runs full within 24 h at the current rate"

  # Wired APs are the OpenWrt nodes named ap-*. 312500000 B/s is 2.5 Gbit/s; a
  # link that negotiates lower, or drops, points at cabling or a port.
  - name: openwrt-wired-aps
    rules:
      - alert: WiredApLinkFlapping
        expr: increase(node_network_carrier_changes_total{job="openwrt", device="eth0", node=~"ap-.*"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.node }}: eth0 changed carrier {{ $value | printf "%.0f" }} times in the last hour (a reboot counts too)'

      - alert: WiredApLinkDegraded
        expr: node_network_speed_bytes{job="openwrt", device="eth0", node=~"ap-.*"} < 312500000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }}: eth0 negotiated {{ $value | humanize }}B/s, below 2.5 Gbit/s"

  # backup_* comes from backup-status.sh --prom via the node_exporter textfile collector
  - name: backup
    rules:
      - alert: BackupTooOld
        expr: time() - backup_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Last successful backup is {{ $value | humanizeDuration }} old"

      - alert: BackupRunFailed
        expr: backup_last_run_success == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The last backup run failed"

      - alert: BackupVerifyFailed
        expr: backup_last_verify_success == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The last backup verification failed"
