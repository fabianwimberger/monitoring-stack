services:
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    user: nobody
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:13.0.1
    container_name: grafana
    user: grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - GF_LOG_LEVEL=warn
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: alloy
    restart: unless-stopped
    # Alloy needs access to the Docker socket and systemd journal.
    # By default it runs as root for backward compatibility with journal
    # access on most hosts. To drop privileges, set DOCKER_GID to your
    # host's docker group ID and uncomment the user line below.
    # user: "473:${DOCKER_GID:-0}"
    group_add:
      - "${DOCKER_GID:-0}"
    cap_add:
      - DAC_READ_SEARCH
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    networks:
      - monitoring
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy --disable-reporting
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/12345"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    # Privileged required for accessing host hardware metrics
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    command:
      - --docker_only=true
      - --disable_root_cgroup_stats=true
      - --global_housekeeping_interval=2m
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --application_metrics_count_limit=10
      - --enable_metrics=cpu,cpuLoad,memory,diskIO,network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  uptime-kuma-data:

networks:
  monitoring:
    driver: bridge
  proxy:
    driver: bridge
