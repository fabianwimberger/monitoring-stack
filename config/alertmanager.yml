# Alerts are grouped and held back briefly, then sent to one receiver. The
# receiver has no integration yet: add one (Telegram example below) in a local
# copy of this file and mount it over this one.
route:
  receiver: default
  group_by: [alertname, instance, name, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: default
