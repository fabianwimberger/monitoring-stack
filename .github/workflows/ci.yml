name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  PROMETHEUS_VERSION: "3.14.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d relaxed config/
          yamllint -d relaxed docker-compose.yml
          yamllint -d relaxed docker-compose.proxy.yml

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config > /dev/null

      - name: Validate docker-compose.proxy.yml syntax
        run: |
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config > /dev/null

  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Prometheus config
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar -xz
          "./prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" check config config/prometheus.yml

      - name: Validate dashboards are valid JSON
        run: |
          for f in dashboards/*.json; do
            jq empty "$f"
          done

      - name: Check required files exist
        run: |
          for f in config/prometheus.yml config/loki.yml config/alloy.alloy .env.example; do
            test -f "$f" || { echo "$f not found"; exit 1; }
          done
