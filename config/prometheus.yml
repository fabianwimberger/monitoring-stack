global:
  scrape_interval: 15s
  evaluation_interval: 60s

rule_files: []

scrape_configs:
  # Host metrics via node_exporter
  # Install node_exporter on your hosts and add their addresses here
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Container metrics via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          nodename: "local"

  # OpenWrt access points / repeaters running node_exporter.
  # Uncomment and set IPs to enable. The `node` label drives the
  # OpenWrt dashboard's device dropdown.
  # - job_name: "openwrt"
  #   static_configs:
  #     - targets: ["192.168.1.10:9100"]
  #       labels:
  #         node: "ap-main"
  #     - targets: ["192.168.1.11:9100"]
  #       labels:
  #         node: "ap-upper"
  #     - targets: ["192.168.1.20:9100"]
  #       labels:
  #         node: "repeater-1"
  #   A repeater's uplink station shows up under its radio MAC, which the
  #   router's host list never sees, so the dashboard cannot name it or give
  #   it an IP. Rewrite each repeater's STA radio MAC to an address the router
  #   knows (its Ethernet MAC) and the uplink series joins names and IPs like
  #   any client. STA MACs change when an uplink moves to another radio.
  #   metric_relabel_configs:
  #     - source_labels: [mac]
  #       regex: "AA:BB:CC:DD:EE:01" # repeater-1 radio STA MAC
  #       target_label: mac
  #       replacement: "AA:BB:CC:DD:EE:00" # repeater-1 Ethernet MAC
